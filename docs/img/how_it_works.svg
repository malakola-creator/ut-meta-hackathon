<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 460" width="1240" height="460" role="img" aria-label="How the mind works: the house feeds the senses; the mesh chip runs the cognitive model (the mind's table) bit for bit and moves the body; the deep brain beside it remembers, rehearses on a copy of the world and writes rows into the table; the Mind Bridge shows the mind and carries six hooks; the Meta layer, made for the hackathon, may only propose through them, and every proposal is checked and kept in the register" font-family="system-ui, sans-serif" font-size="15" fill="currentColor">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fd6"/></marker>
  </defs>
  <!-- the platform: a dashed frame -->
  <rect x="14" y="14" width="880" height="432" rx="16" fill="none" stroke="currentColor" stroke-dasharray="8 6" opacity=".55"/>
  <text x="30" y="40" font-size="13" opacity=".7" letter-spacing="1.5">PLATFORM · ultimateTruth · a cognitive model with a world model inside</text>

  <!-- the world -->
  <rect x="24" y="70" width="206" height="120" rx="12" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="127" y="96" text-anchor="middle" font-weight="700">the environment</text>
  <text x="127" y="116" text-anchor="middle" font-size="12">a simulated house (MuJoCo)</text>
  <text x="127" y="134" text-anchor="middle" font-size="12">bodies: vhum, mehum, vcat</text>
  <text x="127" y="152" text-anchor="middle" font-size="11.5">vacuum, shelf, cactus, trees</text>
  <text x="127" y="172" text-anchor="middle" font-size="12">drawn real in Blender</text>

  <!-- senses -->
  <path d="M230 110 L292 110" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <text x="258" y="100" text-anchor="middle" font-size="12">senses</text>

  <!-- the chip -->
  <rect x="296" y="60" width="250" height="140" rx="12" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <text x="421" y="86" text-anchor="middle" font-weight="700">mesh chip</text>
  <text x="421" y="106" text-anchor="middle" font-size="13" font-weight="700">the cognitive model</text>
  <text x="421" y="126" text-anchor="middle" font-size="12">the mind's table: states, mental factors,</text>
  <text x="421" y="144" text-anchor="middle" font-size="12">decision rows → one of three tendencies</text>
  <text x="421" y="166" text-anchor="middle" font-size="12.5">RTL from the same tables:</text>
  <text x="421" y="184" text-anchor="middle" font-size="12.5">the same in silicon, bit for bit</text>

  <!-- acts -->
  <path d="M546 130 L636 130" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <text x="593" y="120" text-anchor="middle" font-size="12">acts</text>
  <rect x="640" y="92" width="200" height="76" rx="12" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="740" y="120" text-anchor="middle" font-weight="700">body layer</text>
  <text x="740" y="142" text-anchor="middle" font-size="12">the same two-value command,</text>
  <text x="740" y="158" text-anchor="middle" font-size="12">each body's own gait</text>
  <path d="M740 92 C 740 40, 240 40, 127 70" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="600" y="50" text-anchor="middle" font-size="11" opacity=".75">moves in the house</text>

  <!-- the deep brain -->
  <rect x="296" y="268" width="250" height="150" rx="12" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <text x="421" y="292" text-anchor="middle" font-weight="700">deep brain</text>
  <text x="421" y="311" text-anchor="middle" font-size="13" font-weight="700">memory + a world model</text>
  <text x="421" y="330" text-anchor="middle" font-size="12.5">remembers things, places, outcomes</text>
  <text x="421" y="348" text-anchor="middle" font-size="12.5">rehearses on a copy of the world</text>
  <text x="421" y="366" text-anchor="middle" font-size="12.5">(a simulator copy, not learned)</text>
  <text x="421" y="384" text-anchor="middle" font-size="12.5">weighs, then writes new rows</text>
  <text x="421" y="404" text-anchor="middle" font-size="12" opacity=".75">asks aloud about unknown things</text>
  <path d="M400 268 L400 206" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <text x="372" y="241" text-anchor="end" font-size="12">writes rows</text>
  <path d="M442 200 L442 262" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <text x="470" y="241" text-anchor="start" font-size="12">reads the bus</text>

  <!-- the dashboard and the hooks -->
  <rect x="644" y="268" width="220" height="150" rx="12" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="754" y="296" text-anchor="middle" font-weight="700">Mind Bridge</text>
  <text x="754" y="320" text-anchor="middle" font-size="13">watches the mind · hooks H1–H6:</text>
  <text x="754" y="339" text-anchor="middle" font-size="12">H1 the eye as a picture · H2 a name</text>
  <text x="754" y="356" text-anchor="middle" font-size="12">H3 a book · H4 a process candidate</text>
  <text x="754" y="373" text-anchor="middle" font-size="12">H5 the kind of a thing · H6 what it</text>
  <text x="754" y="390" text-anchor="middle" font-size="12">still wonders about</text>
  <path d="M546 343 L640 343" stroke="currentColor" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- the Meta layer, for the hackathon -->
  <rect x="920" y="60" width="300" height="358" rx="16" fill="none" stroke="#2f7fd6" stroke-width="3"/>
  <text x="1070" y="90" text-anchor="middle" font-weight="700" fill="#2f7fd6" font-size="17">Meta layer</text>
  <text x="1070" y="108" text-anchor="middle" font-size="11" opacity=".7">for the hackathon</text>
  <text x="1070" y="134" text-anchor="middle" font-size="13" font-weight="700">understands what a thing is</text>
  <text x="1070" y="153" text-anchor="middle" font-size="12">what it does · is it food · how to act</text>
  <text x="1070" y="172" text-anchor="middle" font-size="12">SAM sees it; Muse / Llama name, read, compose</text>
  <text x="1070" y="202" text-anchor="middle" font-size="13" font-weight="700">each understanding → the Mind Bridge</text>
  <text x="1070" y="221" text-anchor="middle" font-size="12">as a proposal, with the model's reasons</text>
  <text x="1070" y="251" text-anchor="middle" font-size="13" font-weight="700">the gate checks its form</text>
  <text x="1070" y="270" text-anchor="middle" font-size="12">two languages · observations only · primitives</text>
  <text x="1070" y="300" text-anchor="middle" font-size="13" font-weight="700">the body or a person confirms it</text>
  <text x="1070" y="319" text-anchor="middle" font-size="12">the body watches it do that · or point and say</text>
  <text x="1070" y="349" text-anchor="middle" font-size="13" fill="#2f7fd6">another way to teach the robot</text>
  <text x="1070" y="368" text-anchor="middle" font-size="13" fill="#2f7fd6">it proposes · it never commands</text>
  <text x="1070" y="398" text-anchor="middle" font-size="12">the register keeps every proposal and verdict</text>
  <path d="M920 300 L868 300" stroke="#2f7fd6" stroke-width="2.5" marker-end="url(#arrb)"/>
  <text x="894" y="290" text-anchor="middle" font-size="11" fill="#2f7fd6">proposes</text>
  <path d="M868 330 L920 330" stroke="#2f7fd6" stroke-width="2.5" marker-end="url(#arrb)"/>
  <text x="894" y="350" text-anchor="middle" font-size="11" fill="#2f7fd6">reads</text>

  <!-- the moving parts -->
  <circle r="5" fill="#e8a33d"><animateMotion dur="1.6s" repeatCount="indefinite" path="M224,110 L292,110"/></circle>
  <circle r="5" fill="#e8a33d"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.8s" path="M546,130 L640,130"/></circle>
  <circle r="5" fill="#2fae5f"><animateMotion dur="2s" repeatCount="indefinite" path="M400,268 L400,206"/></circle>
  <circle r="4" fill="currentColor" opacity=".7"><animateMotion dur="2s" repeatCount="indefinite" begin="1s" path="M442,200 L442,262"/></circle>
  <circle r="5" fill="#2f7fd6"><animateMotion dur="2.2s" repeatCount="indefinite" path="M920,300 L868,300"/></circle>
  <circle r="5" fill="#2f7fd6"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.7s" path="M640,343 L546,343"/></circle>
  <circle r="4" fill="#2f7fd6" opacity=".7"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.1s" path="M868,330 L920,330"/></circle>
</svg>
